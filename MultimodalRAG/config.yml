# =============================================================================
# MultimodalRAG 全局配置文件（唯一配置来源）
# -----------------------------------------------------------------------------
# 本项目所有配置——API Key、模型、连接端口、存储路径、检索参数——都只在本文件
# 中设置。代码通过 utils/config.py 读取，不再从环境变量或 .env 读取任何配置。
#
# 使用前请把下面各处的 YOUR_*_KEY 替换为你自己的真实 API Key。
# =============================================================================

# ------------------------------ 应用信息 -------------------------------------
app:
  name: "小罗Bot · AI搜索引擎"
  title: "小罗Bot"
  description: "开罗论坛的 AI 搜索引擎助手：既懂论坛，也懂互联网"
  # 前端页面调用本服务时使用的对外名称
  bot_name: "小罗Bot"
  welcome: "你好，我是小罗Bot 🏖️ 开罗论坛的 AI 搜索引擎助手。\n\n我会先检索论坛里的文章、评论与资源，如果论坛中没有相关内容，还可以（在你允许的情况下）联网为你查找答案。"

# ------------------------------ 大模型 / API ---------------------------------
llm:
  # 通用对话与 RAGAS 评估模型（OpenAI 兼容接口）
  openai:
    api_key: "sk-fa1e042ce4cc4ba9b9d6cb37783afb22"
    base_url: "https://api.deepseek.com"
    model: "deepseek-flash"
    temperature: 1.3 #温度设置参考DS文档（1.3为通用对话的合适温度）

  # 多模态大模型（图片描述生成、多模态对话）
  multimodal:
    api_key: "sk-ws-H.PEYXYEI.KAlT.MEYCIQCXrCFWOFVAFr2N3hBv_h-SIf28HyGvte81EF5LCzRXVQIhAPfGIWgUmadlJZIjhlr1LanJCPipyRm0I_IxoHyylZMA"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen3.5-plus-2026-04-20"
    temperature: null           # null = 使用模型默认温度

  # 文本向量嵌入模型（LangChain OpenAIEmbeddings 接口）
  embedding:
    api_key: "sk-ws-H.PEYXYEI.KAlT.MEYCIQCXrCFWOFVAFr2N3hBv_h-SIf28HyGvte81EF5LCzRXVQIhAPfGIWgUmadlJZIjhlr1LanJCPipyRm0I_IxoHyylZMA"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "text-embedding-v4"
    dimensions: 1024
    check_embedding_ctx_length: false

  # 智谱 AI（网络搜索工具）
  zhipu:
    api_key: "ab3e692dfd904d9b9bcfadff662b6de9.P5ZEb22A6kJ7PMGH"

  # DashScope 原生 SDK（多模态嵌入 + 限流/重试策略）
  dashscope:
    # 复用了llm的Api_key（都是从百炼平台使用的）
    multimodal_embedding_model: "multimodal-embedding-v1"
    rpm_limit: 120              # 每分钟最大请求数
    window_seconds: 60          # 限流时间窗口（秒）
    retry_on_429: true          # 遇到 429 是否重试
    max_429_retries: 5          # 429 最大重试次数
    base_backoff: 2.0           # 指数退避基准（秒）
    max_image_bytes: 3145728    # 单张图片体积上限（3 MB），超出则跳过

# ------------------------------ 文档解析 (DotsOCR) ---------------------------
ocr:
  ip: "localhost"               # vLLM / 推理服务地址
  port: 6006                    # vLLM 服务端口
  api_key: "0"                  # vLLM OpenAI 兼容接口的 Key（本地部署通常为占位值）
  model_name: "dots_ocr"
  prompt: "prompt_layout_all_en"
  temperature: 0.1
  top_p: 1.0
  max_completion_tokens: 16384
  num_thread: 1                 # PDF 并行解析线程数（HF 模式强制为 1）
  dpi: 120                      # PDF 渲染 DPI（降低以适配显存）
  max_pixels: 1048576           # 输入图像最大像素（1024*1024）
  min_pixels: null
  no_fitz_preprocess: true      # 是否禁用 PyMuPDF 预处理
  use_hf: true                  # true=本地 HuggingFace 权重，false=远程 vLLM
  hf_model_path: "weights/DotsOCR"
  hf_max_new_tokens: 8192

# ------------------------------ 向量数据库 (Milvus) --------------------------
milvus:
  db_path: "milvus_local.db"                        # 本地 Milvus Lite 数据文件
  doc_collection: "t_doc_collection"                # 旧版 PDF 知识库集合（保留兼容）
  knowledge_collection: "t_knowledge_collection"    # ★ 小罗Bot 统一多模态知识库（论坛+文档）
  context_collection: "t_context_collection"        # 长期记忆（对话上下文）集合
  dim: 1024                                         # 向量维度
  text_max_length: 6000
  description_max_length: 2000
  field_max_length: 1000
  tokenizer: "jieba"
  analyzer_filter: "cnalphanumonly"
  sparse_index:
    index_type: "SPARSE_INVERTED_INDEX"
    metric_type: "BM25"
    inverted_index_algo: "DAAT_MAXSCORE"
    bm25_k1: 1.2
    bm25_b: 0.75
  dense_index:
    index_type: "AUTOINDEX"
    metric_type: "IP"

# ------------------------------ 论坛数据接入 ---------------------------------
# 小罗Bot 的知识来源：优先通过 springboot(bbs-rest) REST 网关拉取，
# 网关不可用时自动回退到直连 MySQL，最后回退到本地快照目录。
forum:
  enabled: true
  # --- 方式一：springboot REST 网关（推荐，也是与论坛后台对接的主通道）---
  base_url: "http://127.0.0.1:7010/api"
  rest_timeout: 30                  # 单次 HTTP 超时（秒）
  page_size: 50                     # 分页拉取每页条数
  max_pages: 40                     # 最多拉取页数（防止无限翻页）
  # 网关中用于导出论坛内容的接口（均已在 bbs-rest 中实现，且都是 @NoNeedLogin）
  endpoints:
    article_list: "/bbs/article/getList"                    # 文章列表（分页）
    article_detail: "/bbs/article/getById"                  # 文章详情（Markdown 正文），?id=
    comment_list: "/bbs/comment/getCommentByArticleId"      # 文章评论，?articleId=
    label_list: "/bbs/label/getList"                        # 标签列表
    resource_list: "/bbs/resource/getList"                  # 资源导航
  # --- 方式二：直连 MySQL（网关不可用时的兜底）---
  mysql:
    enabled: true
    host: "127.0.0.1"
    port: 3306
    user: "root"
    password: "441616300g"
    database: "open_bbs"
    charset: "utf8mb4"
  # --- 方式三：本地快照目录（离线/测试）。目录下放 .md / .txt / .json ---
  local_dir: "forum_snapshot"
  # 入库时抓取正文中的图片（多模态 RAG），关闭则只入库文本
  ingest_images: true
  max_images_per_article: 3
  # 单篇内容分块参数
  chunk_size: 700
  chunk_overlap: 80

# ------------------------------ 联网搜索 -------------------------------------
web_search:
  enabled_by_default: false         # 前端开关的默认值（用户可在页面上开启）
  provider: "zhipu"                 # 搜索服务提供方
  search_engine: "search_pro"
  max_results: 8                    # 最多返回的搜索结果条数
  snippet_max_length: 1200          # 单条搜索结果截断长度
  timeout: 20                       # 搜索超时（秒）

# ------------------------------ 文档附件上传 ---------------------------------
# 让小罗Bot 页面上可以直接上传文档并入知识库，不必再去命令行跑 py 脚本。
# 入库目标与论坛内容、PDF 解析产物是同一个集合（t_knowledge_collection），
# 只是来源类型标为 attachment，便于区分与单独删除。
attachment:
  enabled: true
  # 是否要求管理员才能上传（true=仅管理员，与「同步知识库」一致；
  # 改成 false 则任何登录用户都能往共享知识库里加内容，请谨慎）
  admin_only: true
  max_size_mb: 20                   # 单个文件大小上限（MB）
  allowed_extensions:
    - ".pdf"
    - ".txt"
    - ".md"
    - ".json"
    - ".csv"
    - ".docx"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".webp"
    - ".bmp"
  store_dir: "output/attachments"   # 原文件落盘目录（便于溯源与重新入库）
  # --- 解析限额，避免一个大文件把嵌入额度吃光 ---
  pdf_max_pages: 200                # 只解析前 N 页
  pdf_min_chars_per_page: 20        # 单页文字少于该值视为"无文字"（扫描件）
  csv_max_rows: 500                 # 只取前 N 行
  json_max_chars: 20000             # JSON 转文本后截断长度
  image_max_count: 5                # 单次上传的图片张数上限
  # 附件检索时的展示来源名（前端"按来源"里显示）
  source_label: "上传文档"

# ------------------------------ 多智能体 (Multi-Agent) ------------------------
agent:
  # 调度上限，防止智能体之间无限交接
  # 一次正常问答约 6~8 次交接；"评估不通过→重写一次"会再多 2~3 次
  max_handoffs: 9
  max_web_queries: 2                # 单轮最多联网检索次数
  max_forum_queries: 3              # 单轮最多论坛检索次数
  # 论坛检索结果的相关性阈值。
  # 向量已做 L2 归一化，稠密检索的 IP 距离即余弦相似度；实测：
  #   真正相关的问题/片段 ≈ 0.78 ~ 0.93，完全无关 ≈ 0.44 ~ 0.60
  # 因此 0.70 是一个稳妥的"论坛里到底有没有相关内容"的兜底判据
  # （主判据由评估智能体用大模型判定，这里只是它失败时的降级方案）。
  forum_relevance_threshold: 0.70
  # 少于该条数时认为论坛命中不足，触发联网兜底
  forum_min_hits: 1
  # 答案质量评估阈值（低于该值触发一次重写/联网兜底）
  answer_score_threshold: 0.55
  # 是否启用质量评估智能体（会额外消耗一次 LLM 调用）
  enable_evaluator: true
  # 多轮对话中携带的历史消息条数
  history_window: 8
  # --- 长期记忆（跨会话）---
  memory_top_k: 3
  # 历史回答的相似度阈值：够像才当成"用户又问了一遍相关的事"
  memory_relevance_threshold: 0.82
  # 单轮回答的 max token
  max_answer_tokens: 2048

# ------------------------------ 检索参数 -------------------------------------
retrieval:
  top_k: 3                      # 最终返回条数
  search_limit: 10              # 每路召回的候选数
  agent_top_k: 5                # 小罗Bot 检索最终返回条数
  agent_search_limit: 20        # 小罗Bot 每路召回候选数
  sparse_weight: 1.0            # 混合检索稀疏权重
  dense_weight: 1.0             # 混合检索稠密权重
  nprobe: 10                    # 稠密检索 nprobe
  drop_ratio_search: 0.2        # 稀疏检索忽略低权重词比例
  # 上下文相关性阈值（RAGAS ContextRelevance）：低于该值视为无有效上下文
  context_relevance_threshold: 1.0

# ------------------------------ 分块参数 -------------------------------------
splitter:
  text_chunk_size: 1000         # 超过该长度的文本块再做语义分割
  headers_to_split_on:          # Markdown 标题层级切分配置
    - ["#", "Header 1"]
    - ["##", "Header 2"]
    - ["###", "Header 3"]

# ------------------------------ 工作流参数 -----------------------------------
workflow:
  user_name: "ZS"               # 默认用户名
  evaluate_threshold: 0.7       # RAGAS 答案评估分数；低于该值进入人工审批
  interrupt_before_human: true  # 是否在人工审批节点前中断

# ------------------------------ 存储路径 -------------------------------------
paths:
  output_dir: "output"          # MD 解析产物根目录
  images_subdir: "images"       # 解析出的图片子目录（相对 output_dir）
  forum_images_subdir: "forum"  # 论坛图片缓存子目录（相对 output_dir/images）
  log_dir: "logs"               # 日志目录

# ------------------------------ 日志 -----------------------------------------
logging:
  level: "INFO"                 # Trace < Debug < Info < Success < Warning < Error < Critical
  rotation: "10 MB"
  retention: 20
  to_file: true                 # 是否额外写入文件

# ------------------------------ HTTP 服务（小罗Bot 后端） ---------------------
# 这是 vue-ui → springboot(bbs-rest) → 本服务 的最后一段：
# bbs-rest 通过 ai.agent.base-url 反向代理到这里，本服务只监听本机，不对外暴露。
server:
  host: "127.0.0.1"
  port: 7861
  # 允许跨域的来源（正常走 bbs-rest 网关时不需要；直接用 Gradio/Postman 调试时有用）
  cors_origins:
    - "http://localhost:8082"
    - "http://127.0.0.1:8082"
  # 单个会话最大保留轮数（内存中的会话表）
  max_sessions: 500
  session_ttl_seconds: 7200

# ------------------------------ Gradio 调试界面 ------------------------------
gradio:
  server_name: "127.0.0.1"
  server_port: 7860
  share: false
  debug: true

# ------------------------------ 评估脚本 -------------------------------------
evaluate:
  output_file: "evaluation_results.json"
