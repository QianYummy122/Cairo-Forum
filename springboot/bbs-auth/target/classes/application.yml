server:
  port: 7014

spring:
  application:
    name: ns-bbs-auth
  main:
    allow-circular-references: true
  datasource:
    # 自托管鉴权库（需手动创建数据库 ns_auth 并执行 bbs-auth/db/ns_auth.sql）
    url: jdbc:mysql://127.0.0.1:3306/ns_auth?characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 441616300g
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  data:
    redis:
      # SSO token / 验证码 存储
      host: 127.0.0.1
      port: 6379
      password:
      timeout: 60000
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1

# 自定义配置
auth:
  # 文件上传本地存储目录（本地磁盘绝对路径）
  file-storage-path: ./uploads
  # 文件对外访问 URL 前缀（对应上面目录挂载的静态资源前缀）
  file-url-prefix: http://127.0.0.1:7014/static/
  # 短信（阿里云，可选）
  sms:
    access-key-id:
    access-key-secret:
    sign-name:
    template-code:

dubbo:
  application:
    name: ns-bbs-auth
    serialize-check-status: DISABLE
    register-mode: interface
    parameters:
      migration.step: FORCE_INTERFACE
  registry:
    # 自托管 Zookeeper（四个模块 bbs-rest/bbs-user/bbs-article/bbs-auth 需指向同一地址）
    address: zookeeper://127.0.0.1:2181
    timeout: 60000
  protocol:
    name: dubbo
    port: 22004
  consumer:
    check: false
    timeout: 60000
  config-center:
    timeout: 60000
  provider:
    filter: -exception

mybatis:
  mapper-locations: classpath*:mybatis/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
